name: Benchmark

# Runs the Gatling spike against the demo server on a GitHub runner, in all three modes, and
# fails if a sanity check fails (critical served less than another tier, or requests unaccounted
# for). It does not gate on absolute numbers: a shared runner is noisy. Start it by hand.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per mode
        default: "2"
      pin:
        description: Pin the server and the load generator to separate cores
        type: boolean
        default: false
      modes:
        description: Modes to run, space separated (noshed fixed limiter shed)
        default: "noshed limiter shed"
      contention:
        description: Busy loops to run on the server's cores (needs pin)
        default: "0"
      hold_s:
        description: Seconds to hold the peak (300 for a soak test)
        default: "30"
      peak_mult:
        description: Peak as a multiple of the 100 rps baseline
        default: "6"
      extra_env:
        description: Extra settings, space separated KEY=VALUE (for example SIEVE_LIMIT_ALGO=vegas)
        default: ""

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build
        run: ./gradlew -q :sieve-demo:installDist :sieve-harness:compileGatlingJava
      - name: Runner
        run: |
          {
            echo '```'
            echo "cpus: $(nproc)"
            lscpu | grep -E 'Model name'
            free -g | head -2
            java -version 2>&1 | head -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run spikes
        env:
          SIEVE_PIN: ${{ inputs.pin == true && '1' || '' }}
          ROUNDS: ${{ inputs.rounds }}
          MODES: ${{ inputs.modes }}
          SIEVE_CONTENTION: ${{ inputs.contention }}
          SIEVE_HOLD_S: ${{ inputs.hold_s }}
          SIEVE_PEAK_MULT: ${{ inputs.peak_mult }}
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          mkdir -p results
          for kv in $EXTRA_ENV; do export "$kv"; done
          echo "settings: $EXTRA_ENV peak ${SIEVE_PEAK_MULT}x hold ${SIEVE_HOLD_S}s pin=${SIEVE_PIN:-no}" > results/ci-spike.txt
          for r in $(seq 1 "$ROUNDS"); do
            for m in $MODES; do
              echo "=== round $r $m" >> results/ci-spike.txt
              scripts/spike.sh "$m" >> results/ci-spike.txt 2>&1 \
                || echo "run failed: $m" >> results/ci-spike.txt
            done
          done
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat results/ci-spike.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Evidence bundle
        if: always()
        run: scripts/archive-evidence.sh "ci-${GITHUB_RUN_ID}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
            docs/evidence/ci-*.tar.gz
      - name: Check invariants
        run: |
          if grep -E "MISMATCH|VIOLATED|run failed" results/ci-spike.txt; then
            echo "a sanity check failed"; exit 1
          fi
