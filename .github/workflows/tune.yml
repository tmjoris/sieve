name: Tune

# Runs the threshold tuner on a GitHub runner: coordinate descent over the graded tier thresholds
# and the critical floor, each trial a real server process under an overload spike. Start it by
# hand, then validate the winner with benchmark.yml (arms: default against the tuned settings).
on:
  workflow_dispatch:
    inputs:
      sweeps:
        description: Coordinate descent sweeps
        default: "2"
      rps:
        description: Overload rate in requests per second (1000 is a 10x peak)
        default: "1000"
      seconds:
        description: Seconds at that rate per trial
        default: "8"
      repeats:
        description: Runs averaged per candidate
        default: "2"

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build
        run: ./gradlew -q :sieve-demo:installDist
      - name: Tune
        env:
          SWEEPS: ${{ inputs.sweeps }}
          RPS: ${{ inputs.rps }}
          SECONDS_PER_TRIAL: ${{ inputs.seconds }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          mkdir -p results
          java -cp "sieve-demo/build/install/sieve-demo/lib/*" dev.sieve.demo.Tuner \
            "$SWEEPS" "$RPS" "$SECONDS_PER_TRIAL" "$REPEATS" results/tuned.env \
            2>/dev/null | tee results/tuner.log
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat results/tuner.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuner-results
          path: results/
